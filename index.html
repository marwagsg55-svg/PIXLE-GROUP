<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شانيل TV | Channel TV</title>
    
    <!-- مكتبة Hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <!-- مكتبة Plyr للمشغل الاحترافي -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    
    <!-- خطوط جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #050510;
            --panel-bg: rgba(10, 15, 30, 0.85);
            --neon-cyan: #00f3ff;
            --neon-blue: #0055ff;
            --neon-red: #ff003c;
            --neon-green: #00ff66;
            --text-main: #e0fbfc;
            --plyr-color-main: #00f3ff;
            --plyr-video-background: #000;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh;
            background: var(--bg-color) radial-gradient(circle at 15% 50%, rgba(0, 85, 255, 0.15), transparent 25%);
            color: var(--text-main); font-family: 'Cairo', sans-serif;
            overflow: hidden; backdrop-filter: blur(10px);
            box-sizing: border-box;
        }

        *, *:before, *:after { box-sizing: inherit; }

        /* شبكة الخلفية */
        .cyber-grid {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px; z-index: -1;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) scale(2);
            animation: gridMove 15s linear infinite;
        }
        @keyframes gridMove { 100% { transform: perspective(500px) rotateX(60deg) translateY(30px) scale(2); } }

        /* ================== تصميم اللوغو ================== */
        .brand-logo {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-bottom: 10px;
        }
        .brand-logo svg {
            width: 38px; height: 38px;
            filter: drop-shadow(0 0 8px var(--neon-cyan));
            animation: floatLogo 3s ease-in-out infinite;
        }
        .brand-logo .text {
            font-family: 'Orbitron', 'Cairo', sans-serif;
            font-size: 1.8rem; font-weight: 700; color: #fff;
            text-shadow: 0 0 5px var(--neon-cyan), 0 0 15px var(--neon-blue);
            letter-spacing: 1px;
        }
        .brand-logo .text span {
            color: var(--neon-red);
            text-shadow: 0 0 5px var(--neon-red), 0 0 15px #ff0000;
        }
        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        /* التصميم الافتراضي للكمبيوتر */
        body { display: flex; flex-direction: row-reverse; }

        .sidebar {
            width: 380px; height: 100%; background: var(--panel-bg); backdrop-filter: blur(12px);
            border-right: 1px solid rgba(0, 243, 255, 0.2); box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
            display: block; padding: 20px; z-index: 10;
            transition: 0.4s ease-in-out; overflow-y: auto; scroll-behavior: smooth;
        }

        .player-container { 
            flex-grow: 1; height: 100%; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; padding: 20px; overflow-y: auto; 
        }

        /* وضع السينما */
        body.cinema-active .sidebar { width: 0; padding: 0; overflow: hidden; opacity: 0; border: none; }
        body.cinema-active .player-container { width: 100%; max-width: 100%; padding: 20px 40px; background: rgba(0,0,0,0.95); }
        body.cinema-active .video-wrapper, body.cinema-active .quick-nav { max-width: 1400px; }

        .brand { text-align: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid rgba(0, 243, 255, 0.3); }
        .brand .subtitle { margin-top: 5px; font-size: 0.85rem; color: #a0c4c7; line-height: 1.4; }
        .brand .subtitle span { color: var(--neon-cyan); font-weight: bold; }

        .cyber-input {
            width: 100%; background: rgba(0, 0, 0, 0.6); border: 1px solid var(--neon-cyan);
            color: var(--text-main); padding: 10px 12px; border-radius: 6px; font-family: inherit;
            margin-bottom: 15px; outline: none; transition: 0.3s;
        }
        .cyber-input:focus { box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); }
        .cyber-input option { background: #050510; color: var(--neon-cyan); }

        .groups-container { padding-right: 5px; padding-bottom: 20px; }
        
        details { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(0, 243, 255, 0.15); border-radius: 6px; margin-bottom: 8px; }
        summary { padding: 10px; cursor: pointer; font-weight: bold; background: linear-gradient(90deg, rgba(0,85,255,0.2), transparent); display: flex; justify-content: space-between; border-radius: 6px; font-size: 0.95rem; }
        summary:hover { background: linear-gradient(90deg, rgba(0,243,255,0.3), transparent); }
        
        .channel-btn {
            display: grid; grid-template-columns: 32px 1fr 22px 10px; align-items: center; gap: 8px;
            width: 100%; padding: 8px 10px; background: transparent; color: #a0c4c7; 
            border: none; border-top: 1px solid rgba(255,255,255,0.05); cursor: pointer; 
            font-family: inherit; transition: 0.3s;
        }
        .channel-btn:hover { background: rgba(0, 243, 255, 0.1); color: var(--neon-cyan); padding-right: 15px; }

        .channel-logo { width: 32px; height: 32px; border-radius: 4px; object-fit: contain; background: #fff; padding: 2px; justify-self: center; }
        .channel-name { text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.9rem; }
        
        .fav-btn { background: none; border: none; font-size: 1.1rem; color: #555; cursor: pointer; transition: 0.3s; padding: 0; outline: none; justify-self: center; }
        .fav-btn:hover { transform: scale(1.2); }
        .fav-btn.is-fav { color: #ffd700; text-shadow: 0 0 8px #ffd700; }

        .status-indicator { width: 8px; height: 8px; border-radius: 50%; background: #555; transition: 0.3s; justify-self: center; }
        .status-online { background: var(--neon-green); box-shadow: 0 0 8px var(--neon-green); animation: pulse 2s infinite; }
        .status-offline { background: var(--neon-red); box-shadow: 0 0 8px var(--neon-red); }
        @keyframes pulse { 50% { box-shadow: 0 0 12px var(--neon-green); } }

        .controls-bar { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: rgba(10,15,30,0.8); padding: 8px 15px; border: 1px solid rgba(0,243,255,0.3); border-radius: 8px; flex-shrink: 0; }
        .top-btn { background: rgba(0, 243, 255, 0.1); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 5px 12px; border-radius: 4px; cursor: pointer; font-family: inherit; font-weight: bold; font-size: 0.85rem; transition: 0.3s; }
        .top-btn:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 12px var(--neon-cyan); }
        .quality-selector { background: #000; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 5px 10px; border-radius: 4px; outline: none; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
        
        .video-wrapper { width: 100%; max-width: 900px; padding: 4px; background: linear-gradient(45deg, var(--neon-blue), var(--neon-cyan)); border-radius: 12px; box-shadow: 0 0 25px rgba(0,243,255,0.2); flex-shrink: 0; }
        .plyr { border-radius: 8px; }
        
        .now-playing { width: 100%; max-width: 900px; margin-top: 12px; font-size: 1.1rem; font-weight: bold; color: var(--neon-cyan); text-shadow: 0 0 8px rgba(0,243,255,0.5); font-family: 'Orbitron', sans-serif; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
        .now-playing img { width: 36px; height: 36px; border-radius: 5px; object-fit: contain; background: #fff; padding: 2px; }

        .quick-nav {
            width: 100%; max-width: 900px; display: flex; gap: 15px; align-items: center;
            padding: 15px 5px; margin-top: 5px; overflow-x: auto;
            background: transparent; border: none; flex-shrink: 0;
            scrollbar-width: none; -ms-overflow-style: none; scroll-behavior: smooth;
        }
        .quick-nav::-webkit-scrollbar { display: none; }
        
        .bubble-btn {
            width: 60px; height: 60px; border-radius: 50%;
            background: #ffffff; border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.2);
            flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .bubble-btn:hover {
            transform: scale(1.2) translateY(-6px);
            border-color: var(--neon-cyan);
            box-shadow: 0 12px 20px rgba(0, 243, 255, 0.6), inset 0 0 10px rgba(0, 243, 255, 0.3);
            z-index: 2;
        }
        .bubble-btn img { width: 100%; height: 100%; object-fit: contain; padding: 5px; border-radius: 50%; }
        .bubble-fallback {
            font-size: 0.8rem; color: #000; font-weight: bold; text-align: center; 
            line-height: 1.1; width: 100%; padding: 0 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 10px; }

        /* ================== وضع الموبايل ================== */
        @media (max-width: 768px) {
            body { 
                flex-direction: column !important; 
                overflow: hidden; 
            }
            
            .player-container { 
                order: 1; width: 100%; height: auto; max-height: 55dvh;
                padding: 6px 10px; flex-shrink: 0; overflow-y: auto;
            }
            
            .mobile-brand-box {
                display: block !important;
                width: 100%; text-align: center; margin-bottom: 6px;
                padding-bottom: 6px; border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            }
            .mobile-brand-box p { margin: 4px 0 0 0; font-size: 0.75rem; color: #a0c4c7; }
            .mobile-brand-box span { color: var(--neon-cyan); font-weight: bold; }

            .sidebar .brand { display: none; }

            .sidebar { 
                order: 2; width: 100%; flex-grow: 1; height: 45dvh;
                border-right: none; border-top: 2px solid var(--neon-cyan); 
                padding: 15px 12px; display: block;
                overflow-y: auto !important; 
                box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
                background: rgba(5, 10, 20, 0.95);
            }

            .video-wrapper { max-width: 100%; }
            .controls-bar { max-width: 100%; padding: 4px 8px; margin-bottom: 6px; }
            .top-btn, .quality-selector { font-size: 0.75rem; padding: 3px 8px; }
            .now-playing { max-width: 100%; font-size: 0.9rem; margin-top: 8px; }
            
            .quick-nav { display: none !important; }
            
            body.cinema-active .player-container { height: 100dvh; max-height: 100dvh; justify-content: center; }
            body.cinema-active .sidebar { display: none; }
            
            .brand-logo .text { font-size: 1.4rem; }
            .brand-logo svg { width: 30px; height: 30px; }
        }

        .mobile-brand-box { display: none; }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>

    <!-- الجزء العلوي الثابت -->
    <div class="player-container">
        
        <!-- هوية الموقع على الموبايل -->
        <div class="mobile-brand-box">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 3H3C1.895 3 1 3.895 1 5V17C1 18.105 1.895 19 3 19H8V21H16V19H21C22.105 19 23 18.105 23 17V5C23 3.895 22.105 3 21 3ZM21 17H3V5H21V17ZM9.5 14L15.5 11L9.5 8V14Z" fill="var(--neon-cyan)"/>
                </svg>
                <div class="text">شانيل <span>TV</span></div>
            </div>
            <p>برمجة وتصميم: <span>جمال الحسن</span></p>
        </div>

        <div class="controls-bar">
            <button class="top-btn" onclick="toggleCinemaMode()">وضع السينما 🍿</button>
            <div>
                <label style="font-size: 0.7rem; color: var(--neon-cyan); margin-left: 3px;">الدقة:</label>
                <select id="quality-select" class="quality-selector" onchange="changeQuality(this.value)">
                    <option value="-1">تلقائي (Auto)</option>
                </select>
            </div>
        </div>
        
        <div class="video-wrapper">
            <video id="video" crossorigin playsinline controls autoplay></video>
        </div>
        
        <div class="now-playing" id="now-playing-text">النظام في وضع الاستعداد</div>
        
        <div class="quick-nav" id="quick-nav" style="display: none;"></div>
    </div>

    <!-- الجزء السفلي المتحرك بالكامل -->
    <div class="sidebar">
        
        <!-- هوية الموقع على الكمبيوتر -->
        <div class="brand">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 3H3C1.895 3 1 3.895 1 5V17C1 18.105 1.895 19 3 19H8V21H16V19H21C22.105 19 23 18.105 23 17V5C23 3.895 22.105 3 21 3ZM21 17H3V5H21V17ZM9.5 14L15.5 11L9.5 8V14Z" fill="var(--neon-cyan)"/>
                </svg>
                <div class="text">شانيل <span>TV</span></div>
            </div>
            <div class="subtitle">برمجة وتصميم:<br><span>جمال الحسن</span></div>
        </div>

        <select id="playlist-selector" class="cyber-input" onchange="loadSelectedPlaylist()">
            <option value="https://iptv-org.github.io/iptv/languages/ara.m3u">القنوات العربية</option>
            <option value="https://iptv-org.github.io/iptv/index.category.m3u">القائمة العالمية (حسب التصنيف)</option>
            <option value="https://iptv-org.github.io/iptv/index.m3u">القائمة الشاملة (جميع القنوات)</option>
        </select>

        <input type="text" id="search-box" class="cyber-input" placeholder="بحث سريع عن قناة..." oninput="filterChannels()">

        <div class="groups-container" id="groups-list">
            <div style="color: var(--neon-cyan); text-align: center; margin-top: 30px;">جاري تهيئة النظام...</div>
        </div>
    </div>

    <script>
        let hls;
        let allChannelsData = {};
        let myFavorites = JSON.parse(localStorage.getItem('pixel_favorites')) || [];

        const video = document.getElementById('video');
        const groupsList = document.getElementById('groups-list');
        const nowPlaying = document.getElementById('now-playing-text');
        const qualitySelect = document.getElementById('quality-select');
        const playlistSelector = document.getElementById('playlist-selector');
        const quickNav = document.getElementById('quick-nav');
        
        const player = new Plyr(video, {
            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'],
            settings: ['captions', 'quality', 'speed'],
            i18n: { speed: 'السرعة', normal: 'طبيعي', play: 'تشغيل', pause: 'إيقاف', pip: 'صورة مصغرة' }
        });

        window.onload = () => {
            const savedPlaylist = localStorage.getItem('pixel_last_playlist');
            if (savedPlaylist) playlistSelector.value = savedPlaylist;
            
            loadSelectedPlaylist();

            const lastChannel = JSON.parse(localStorage.getItem('pixel_last_channel'));
            if (lastChannel) playChannel(lastChannel.url, lastChannel.name, lastChannel.logo, false);

            if(myFavorites.length > 0) updateQuickNav(myFavorites);
        };

        function toggleCinemaMode() {
            document.body.classList.toggle('cinema-active');
        }

        async function loadSelectedPlaylist() {
            const url = playlistSelector.value;
            localStorage.setItem('pixel_last_playlist', url);
            groupsList.innerHTML = '<div style="color: var(--neon-cyan); text-align: center; margin-top: 30px;">جاري استيراد البيانات...</div>';
            
            try {
                const res = await fetch(url);
                const data = await res.text();
                allChannelsData = parseM3U(data);
                renderGroups(allChannelsData);
            } catch (err) {
                groupsList.innerHTML = '<div style="color: var(--neon-red); text-align: center; margin-top: 30px;">فشل الاتصال بالخادم.</div>';
            }
        }

        function parseM3U(content) {
            const lines = content.split('\n');
            const groups = {};
            let currentGroup = 'عام', currentName = '', currentLogo = '';

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const groupMatch = line.match(/group-title="([^"]+)"/i);
                    currentGroup = groupMatch ? groupMatch[1] : 'قنوات عامة';
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                    currentLogo = logoMatch ? logoMatch[1] : '';
                    const commaIndex = line.lastIndexOf(',');
                    currentName = commaIndex !== -1 ? line.substring(commaIndex + 1).trim() : 'قناة غير معنونة';
                } else if (line && !line.startsWith('#')) {
                    if (!groups[currentGroup]) groups[currentGroup] = [];
                    if (currentName) groups[currentGroup].push({ name: currentName, url: line, logo: currentLogo });
                    currentName = ''; currentLogo = '';
                }
            });
            return groups;
        }

        function renderGroups(groups, autoOpen = false, filterText = '') {
            groupsList.innerHTML = '';
            
            // فلترة المفضلة أثناء البحث
            let favsToRender = myFavorites;
            if (filterText) {
                favsToRender = myFavorites.filter(ch => ch.name.toLowerCase().includes(filterText));
            }

            if (favsToRender.length > 0) {
                createGroupElement('⭐ المفضلة', favsToRender, true);
            }

            Object.keys(groups).sort().forEach(group => {
                createGroupElement(group, groups[group], autoOpen);
            });
        }

        function createGroupElement(groupName, channelsArray, autoOpen) {
            if(channelsArray.length === 0) return;

            const details = document.createElement('details');
            details.innerHTML = `
                <summary><span>${groupName}</span> <span style="color:#888; font-size:0.8rem;" class="count-badge">[${channelsArray.length}]</span></summary>
                <div class="channels-container"></div>
            `;
            const container = details.querySelector('.channels-container');

            if (autoOpen || groupName === '⭐ المفضلة') {
                details.open = true;
                populateChannels(channelsArray, container, details);
            } else {
                details.addEventListener('toggle', function() {
                    if (this.open && !this.dataset.loaded) {
                        this.dataset.loaded = "true";
                        populateChannels(channelsArray, container, this);
                        updateQuickNav(channelsArray);
                    }
                });
            }
            groupsList.appendChild(details);
        }

        function populateChannels(channels, container, detailsNode) {
            let html = '';
            channels.forEach((ch, index) => {
                const btnId = 'btn-' + Math.random().toString(36).substr(2, 9);
                const logoHtml = ch.logo 
                    ? `<img src="${ch.logo}" class="channel-logo" loading="lazy" onerror="this.style.opacity='0'">` 
                    : `<div class="channel-logo" style="background:transparent;"></div>`;

                const isFav = myFavorites.some(f => f.url === ch.url);
                const starClass = isFav ? 'fav-btn is-fav' : 'fav-btn';
                const starChar = isFav ? '★' : '☆';

                html += `
                    <div class="channel-btn" id="${btnId}" data-url="${ch.url}" onclick="playChannel('${ch.url}', '${ch.name.replace(/'/g, "\\'")}', '${ch.logo}')">
                        ${logoHtml}
                        <span class="channel-name">${ch.name}</span>
                        <button class="${starClass}" onclick="event.stopPropagation(); toggleFavorite('${ch.url}', '${ch.name.replace(/'/g, "\\'")}', '${ch.logo}')">${starChar}</button>
                        <div class="status-indicator"></div>
                    </div>
                `;
                
                // الفحص الذكي في الخلفية (بطريقة آمنة لا تحذف قنوات البحث الشغالة)
                setTimeout(() => checkChannelStatus(ch.url, btnId, detailsNode), index * 50); 
            });
            container.innerHTML = html;
        }

        function updateQuickNav(channelsArray) {
            quickNav.innerHTML = '';
            if(!channelsArray || channelsArray.length === 0) {
                quickNav.style.display = 'none';
                return;
            }
            quickNav.style.display = 'flex';
            
            channelsArray.forEach(ch => {
                const btn = document.createElement('div');
                btn.className = 'bubble-btn';
                btn.title = ch.name; 
                btn.onclick = () => playChannel(ch.url, ch.name.replace(/'/g, "\\'"), ch.logo);
                
                if (ch.logo) {
                    const img = document.createElement('img');
                    img.src = ch.logo;
                    img.loading = 'lazy';
                    img.onerror = function() {
                        this.style.display = 'none';
                        const fallback = document.createElement('div');
                        fallback.className = 'bubble-fallback';
                        fallback.innerText = ch.name.substring(0, 4); 
                        btn.appendChild(fallback);
                    };
                    btn.appendChild(img);
                } else {
                    const fallback = document.createElement('div');
                    fallback.className = 'bubble-fallback';
                    fallback.innerText = ch.name.substring(0, 4);
                    btn.appendChild(fallback);
                }
                quickNav.appendChild(btn);
            });
        }

        function toggleFavorite(url, name, logo) {
            const index = myFavorites.findIndex(f => f.url === url);
            if (index > -1) {
                myFavorites.splice(index, 1);
            } else {
                myFavorites.push({ url, name, logo });
            }
            localStorage.setItem('pixel_favorites', JSON.stringify(myFavorites));
            
            const filter = document.getElementById('search-box').value.toLowerCase();
            if(filter) filterChannels(); else renderGroups(allChannelsData);
            
            updateQuickNav(myFavorites);
        }

        // دالة الفحص الذكي المُحدَّثة (Smart Check) لحماية نتائج البحث
        async function checkChannelStatus(url, btnId, detailsNode) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3500); // 3.5 ثواني
                
                // no-cors يمنع متصفحك من حظر الروابط المحمية ويعطيها فرصة للظهور والعمل
                const res = await fetch(url, { mode: 'no-cors', signal: controller.signal });
                clearTimeout(timeoutId);
                
                const btn = document.getElementById(btnId);
                if (btn) btn.querySelector('.status-indicator').className = 'status-indicator status-online';
            } catch (e) { 
                // لن يتم حذف القناة إلا إذا كان السيرفر لا يستجيب نهائياً (ميت)
                removeOfflineChannel(btnId, detailsNode);
            }
        }

        function removeOfflineChannel(btnId, detailsNode) {
            const btn = document.getElementById(btnId);
            if (btn) {
                btn.remove();
                if (detailsNode) {
                    const badge = detailsNode.querySelector('.count-badge');
                    if (badge) {
                        let currentCount = parseInt(badge.innerText.replace(/[^0-9]/g, '')) || 0;
                        currentCount = Math.max(0, currentCount - 1);
                        badge.innerText = `[${currentCount}]`;
                        if (currentCount === 0) detailsNode.style.display = 'none';
                    }
                }
            }
        }

        let searchTimeout;
        function filterChannels() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const filter = document.getElementById('search-box').value.toLowerCase();
                if (!filter) { renderGroups(allChannelsData); return; }

                const filteredGroups = {};
                Object.keys(allChannelsData).forEach(group => {
                    const matchedChannels = allChannelsData[group].filter(ch => ch.name.toLowerCase().includes(filter));
                    if (matchedChannels.length > 0) filteredGroups[group] = matchedChannels;
                });
                // إرسال كلمة البحث ليتم تطبيقها على مجلد المفضلة أيضاً
                renderGroups(filteredGroups, true, filter); 
            }, 300);
        }

        function playChannel(url, name, logoUrl, autoPlay = true) {
            localStorage.setItem('pixel_last_channel', JSON.stringify({ url, name, logo: logoUrl }));

            const logoDisplay = (logoUrl && logoUrl !== 'undefined') 
                ? `<img src="${logoUrl}" onerror="this.style.display='none'">` : '';
            nowPlaying.innerHTML = `${logoDisplay} <span>جاري عرض: ${name}</span>`;
            
            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, (e, data) => {
                    qualitySelect.innerHTML = '<option value="-1">تلقائي (Auto)</option>';
                    data.levels.forEach((lvl, i) => {
                        const opt = document.createElement('option');
                        opt.value = i; opt.innerText = lvl.height ? lvl.height + 'p' : `مستوى ${i + 1}`;
                        qualitySelect.appendChild(opt);
                    });
                    if(autoPlay) video.play().catch(() => {});
                });
                hls.on(Hls.Events.ERROR, (e, data) => { if (data.fatal) nowPlaying.innerHTML = "خطأ: فشل الاتصال بالقناة أو السيرفر محمي."; });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                if(autoPlay) video.play();
            }
        }

        function changeQuality(lvl) { if (hls) hls.currentLevel = parseInt(lvl); }
    </script>
</body>
</html>

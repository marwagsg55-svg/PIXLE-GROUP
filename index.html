<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شانيل TV | Channel TV</title>
    
    <!-- إعدادات الـ PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050510">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3076/3076772.png">

    <!-- محركات البث المباشر -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

    <!-- خطوط جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #050510; --panel-bg: rgba(10, 15, 30, 0.85);
            --neon-cyan: #00f3ff; --neon-blue: #0055ff;
            --neon-red: #ff003c; --neon-green: #00ff66;
            --text-main: #e0fbfc;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh;
            background: var(--bg-color);
            color: var(--text-main); font-family: 'Cairo', sans-serif;
            overflow: hidden; box-sizing: border-box;
        }

        *, *:before, *:after { box-sizing: inherit; }

        /* الشبكة السيبرانية على الشاشات الكبيرة فقط */
        .cyber-grid {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px; z-index: -1;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) scale(2);
            animation: gridMove 15s linear infinite; will-change: transform;
        }
        @keyframes gridMove { 100% { transform: perspective(500px) rotateX(60deg) translateY(30px) scale(2); } }

        .brand-logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .brand-logo svg { width: 38px; height: 38px; filter: drop-shadow(0 0 8px var(--neon-cyan)); }
        .brand-logo .text { font-family: 'Orbitron', 'Cairo', sans-serif; font-size: 1.8rem; font-weight: 700; color: #fff; text-shadow: 0 0 5px var(--neon-cyan), 0 0 15px var(--neon-blue); letter-spacing: 1px; }
        .brand-logo .text span { color: var(--neon-red); text-shadow: 0 0 5px var(--neon-red), 0 0 15px #ff0000; }

        body { display: flex; flex-direction: row-reverse; }

        .sidebar {
            width: 380px; height: 100%; background: var(--panel-bg); 
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-right: 1px solid rgba(0, 243, 255, 0.2); box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
            display: block; padding: 20px; z-index: 10; transition: 0.3s ease-in-out; overflow-y: auto; scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .player-container { flex-grow: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }

        body.cinema-active .sidebar { width: 0; padding: 0; overflow: hidden; opacity: 0; border: none; }
        body.cinema-active .player-container { width: 100%; max-width: 100%; padding: 20px 40px; background: rgba(0,0,0,0.98); }
        body.cinema-active .video-container-wrapper, body.cinema-active .quick-nav { max-width: 1400px; }

        .brand { text-align: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid rgba(0, 243, 255, 0.3); }
        .brand .subtitle { margin-top: 5px; font-size: 0.85rem; color: #a0c4c7; line-height: 1.4; }
        .brand .subtitle span { color: var(--neon-cyan); font-weight: bold; }

        .cyber-input { width: 100%; background: rgba(0, 0, 0, 0.6); border: 1px solid var(--neon-cyan); color: var(--text-main); padding: 10px 12px; border-radius: 6px; font-family: inherit; margin-bottom: 15px; outline: none; transition: 0.3s; }
        .cyber-input:focus { box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); }
        .cyber-input option { background: #050510; color: var(--neon-cyan); }

        .groups-container { padding-right: 5px; padding-bottom: 20px; }
        details { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(0, 243, 255, 0.15); border-radius: 6px; margin-bottom: 8px; }
        summary { padding: 10px; cursor: pointer; font-weight: bold; background: linear-gradient(90deg, rgba(0,85,255,0.2), transparent); display: flex; justify-content: space-between; border-radius: 6px; font-size: 0.95rem; }
        summary:hover { background: linear-gradient(90deg, rgba(0,243,255,0.3), transparent); }
        
        /* تفعيل التسريع العتادي وتخطي العناصر غير المعروضة */
        .channel-btn { 
            display: grid; grid-template-columns: 32px 1fr 24px 22px; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; 
            background: transparent; color: #a0c4c7; border: none; border-top: 1px solid rgba(255,255,255,0.05); cursor: pointer; 
            font-family: inherit; transition: background-color 0.15s ease;
            content-visibility: auto;
            contain-intrinsic-size: 0 46px;
        }
        .channel-btn:hover { background: rgba(0, 243, 255, 0.1); color: var(--neon-cyan); }
        .channel-btn.active-channel { background: rgba(0, 243, 255, 0.25) !important; color: #fff !important; font-weight: bold; }

        .channel-logo { width: 32px; height: 32px; border-radius: 4px; object-fit: contain; background: #fff; padding: 2px; justify-self: center; }
        .channel-name { text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.9rem; }
        .channel-status { text-align: center; font-size: 0.85rem; justify-self: center; }
        
        .fav-btn { background: none; border: none; font-size: 1.1rem; color: #555; cursor: pointer; padding: 0; outline: none; justify-self: center; }
        .fav-btn.is-fav { color: #ffd700; }

        .controls-bar { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: rgba(10,15,30,0.9); padding: 6px 10px; border: 1px solid rgba(0,243,255,0.3); border-radius: 8px; flex-shrink: 0; gap: 4px; flex-wrap: nowrap; z-index: 5; }
        
        .top-btn { background: rgba(0, 243, 255, 0.1); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-family: inherit; font-weight: bold; font-size: 0.75rem; white-space: nowrap; flex-shrink: 1; }
        .top-btn:hover { background: var(--neon-cyan); color: #000; }
        
        .scan-manual-btn { border-color: var(--neon-green); color: var(--neon-green); }
        .delete-offline-btn { border-color: var(--neon-red); color: var(--neon-red); }
        .install-pwa-btn { border-color: #ffd700; color: #ffd700; display: none; }
        .quality-selector { background: #000; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 3px 6px; border-radius: 4px; outline: none; cursor: pointer; font-family: inherit; font-size: 0.75rem; }
        
        .video-container-wrapper { position: relative; width: 100%; max-width: 900px; flex-shrink: 0; }

        .ambient-glow {
            position: absolute; inset: -15px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-cyan), #ff003c, var(--neon-green));
            background-size: 300% 300%; border-radius: 18px; filter: blur(30px);
            opacity: 0; z-index: -1; transition: opacity 0.5s ease; pointer-events: none;
        }

        body.cinema-active .ambient-glow {
            opacity: 0.6;
            animation: ambilightShift 8s ease infinite;
        }

        @keyframes ambilightShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .video-wrapper { 
            width: 100%; padding: 4px; background: linear-gradient(45deg, var(--neon-blue), var(--neon-cyan)); 
            border-radius: 12px; box-shadow: 0 0 20px rgba(0,243,255,0.2); 
            display: flex; align-items: center; justify-content: center; background-color: #000;
        }

        .video-wrapper video {
            width: 100%; height: auto; max-height: 60vh; display: block;
            border-radius: 8px; background: #000; outline: none;
        }
        
        .now-playing { width: 100%; max-width: 900px; margin-top: 10px; font-size: 1rem; font-weight: bold; color: var(--neon-cyan); font-family: 'Orbitron', sans-serif; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .now-playing img { width: 32px; height: 32px; border-radius: 5px; object-fit: contain; background: #fff; padding: 2px; }

        .quick-nav { width: 100%; max-width: 900px; display: flex; gap: 12px; align-items: center; padding: 12px 5px; margin-top: 4px; overflow-x: auto; background: transparent; border: none; flex-shrink: 0; scrollbar-width: none; }
        .quick-nav::-webkit-scrollbar { display: none; }
        
        .bubble-btn { width: 55px; height: 55px; border-radius: 50%; background: #ffffff; border: 2px solid var(--neon-cyan); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .bubble-btn img { width: 100%; height: 100%; object-fit: contain; padding: 4px; border-radius: 50%; }
        .bubble-fallback { font-size: 0.75rem; color: #000; font-weight: bold; text-align: center; width: 100%; padding: 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        ::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 6px; }

        .cyber-modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
        }

        .cyber-modal-overlay.active { opacity: 1; pointer-events: auto; }

        .cyber-modal {
            width: 88%; max-width: 360px; background: #080d1a;
            border: 1px solid var(--neon-cyan); border-radius: 12px;
            padding: 22px 18px; text-align: center;
        }

        .cyber-modal-icon { font-size: 2rem; margin-bottom: 8px; }
        .cyber-modal h3 { margin: 0 0 6px 0; font-size: 1.15rem; color: #fff; }
        .cyber-modal p { margin: 0 0 16px 0; font-size: 0.8rem; color: #a0c4c7; }
        .modal-error { color: var(--neon-red); font-size: 0.8rem; margin-top: -6px; margin-bottom: 10px; display: none; }
        .modal-actions { display: flex; gap: 8px; justify-content: center; }
        .modal-btn { flex: 1; padding: 8px 12px; font-family: inherit; font-size: 0.8rem; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .modal-btn-confirm { background: rgba(0, 243, 255, 0.2); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); }
        .modal-btn-cancel { background: rgba(255, 0, 60, 0.15); border: 1px solid var(--neon-red); color: var(--neon-red); }

        .shake-animation { animation: modalShake 0.35s ease-in-out; }
        @keyframes modalShake {
            0%, 100% { transform: translateX(0); }
            25%, 75% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
        }

        /* ================== تحسينات فائقة السرعة للموبايل ================== */
        @media (max-width: 768px) {
            /* إيقاف الشبكة والأنيميشن الثقيل لتخفيف الحمل على كرت الشاشة */
            .cyber-grid { display: none !important; }
            .ambient-glow { display: none !important; }
            
            body { flex-direction: column !important; background: #050510 !important; }
            
            /* إلغاء الـ backdrop-filter بالكامل على الموبايل لإنهاء لاغ التمرير */
            .sidebar { 
                order: 2; width: 100%; flex-grow: 1; height: 48dvh; 
                border-right: none; border-top: 2px solid var(--neon-cyan); 
                padding: 12px 10px; display: block; overflow-y: auto !important; 
                background: #070b14 !important;
                backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
                box-shadow: none !important;
            }

            .player-container { 
                order: 1; width: 100%; height: auto; max-height: 52dvh; 
                padding: 4px 8px; flex-shrink: 0; overflow-y: auto; 
                background: #050510 !important;
                backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
            }

            .mobile-brand-box { display: block !important; width: 100%; text-align: center; margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px solid rgba(0, 243, 255, 0.2); }
            .mobile-brand-box p { margin: 2px 0 0 0; font-size: 0.7rem; color: #a0c4c7; }
            .mobile-brand-box span { color: var(--neon-cyan); font-weight: bold; }
            .sidebar .brand { display: none; }
            
            .video-container-wrapper { max-width: 100%; }
            .video-wrapper video { max-height: 38vh; }
            .controls-bar { max-width: 100%; padding: 4px; margin-bottom: 4px; gap: 2px; background: #080d1a !important; }
            .top-btn, .quality-selector { font-size: 0.52rem; padding: 3px 4px; }
            .quality-selector { max-width: 52px; }
            .now-playing { max-width: 100%; font-size: 0.85rem; margin-top: 6px; }
            .quick-nav { display: none !important; }
            
            body.cinema-active .player-container { height: 100dvh; max-height: 100dvh; justify-content: center; }
            body.cinema-active .sidebar { display: none; }
            .brand-logo .text { font-size: 1.3rem; text-shadow: none; }
            .brand-logo svg { width: 26px; height: 26px; filter: none; }
        }
        .mobile-brand-box { display: none; }
    </style>
</head>

    <script>
        let hlsInstance = null;
        let dashInstance = null;
        let tsInstance = null;
        
        let allChannelsData = {};
        let myFavorites = JSON.parse(localStorage.getItem('pixel_favorites')) || [];

        const video = document.getElementById('video');
        const groupsList = document.getElementById('groups-list');
        const nowPlaying = document.getElementById('now-playing-text');
        const qualitySelect = document.getElementById('quality-select');
        const playlistSelector = document.getElementById('playlist-selector');
        const quickNav = document.getElementById('quick-nav');
        
        const passwordModal = document.getElementById('password-modal');
        const modalBox = document.getElementById('modal-box');
        const modalInput = document.getElementById('modal-password-input');
        const modalError = document.getElementById('modal-error-text');
        let pendingSelectorElem = null;

        const CF_PROXY = "https://lucky-mountain-399achaneltv-proxy.marwagsg55.workers.dev/?url=";

        function resolveStreamUrl(targetUrl) {
            if (!targetUrl) return '';
            if (targetUrl.startsWith(CF_PROXY)) return targetUrl;
            if (targetUrl.startsWith('https://')) return targetUrl;
            return CF_PROXY + encodeURIComponent(targetUrl);
        }

        function extractRawUrl(wrappedUrl) {
            if (wrappedUrl && wrappedUrl.includes(CF_PROXY)) {
                return decodeURIComponent(wrappedUrl.substring(wrappedUrl.indexOf(CF_PROXY) + CF_PROXY.length));
            }
            return wrappedUrl;
        }

        function rewriteManifestEntries(manifestText, originalBaseUrl) {
            const lines = manifestText.split('\n');
            const rewritten = [];

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;

                if (line.startsWith('#')) {
                    if (line.includes('URI="')) {
                        line = line.replace(/URI="([^"]+)"/g, (match, uri) => {
                            try {
                                const resolved = new URL(uri, originalBaseUrl).href;
                                return 'URI="' + resolveStreamUrl(resolved) + '"';
                            } catch (e) {
                                return match;
                            }
                        });
                    }
                    rewritten.push(line);
                } else {
                    try {
                        const absoluteUrl = new URL(line, originalBaseUrl).href;
                        rewritten.push(resolveStreamUrl(absoluteUrl));
                    } catch (e) {
                        rewritten.push(line);
                    }
                }
            }
            return rewritten.join('\n');
        }

        class StreamSecurityLoader extends Hls.DefaultConfig.loader {
            constructor(config) {
                super(config);
                const standardLoad = this.load.bind(this);

                this.load = function (context, config, callbacks) {
                    const rawTargetUrl = extractRawUrl(context.url);
                    context.url = resolveStreamUrl(rawTargetUrl);

                    const standardOnSuccess = callbacks.onSuccess;
                    callbacks.onSuccess = function (response, stats, context, networkDetails) {
                        if ((context.type === 'manifest' || context.type === 'level') && typeof response.data === 'string') {
                            response.data = rewriteManifestEntries(response.data, rawTargetUrl);
                        }
                        standardOnSuccess(response, stats, context, networkDetails);
                    };

                    standardLoad(context, config, callbacks);
                };
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }

        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') installBtn.style.display = 'none';
                    deferredPrompt = null;
                });
            }
        }

        window.onload = () => {
            try {
                const savedPlaylist = localStorage.getItem('pixel_last_playlist');
                if (savedPlaylist && savedPlaylist !== "https://raw.githubusercontent.com/zwrt/IPTV/refs/heads/Files/Adult.m3u") {
                    playlistSelector.value = savedPlaylist;
                    loadSelectedPlaylist(savedPlaylist);
                } else {
                    playlistSelector.value = "https://iptv-org.github.io/iptv/languages/ara.m3u";
                    loadSelectedPlaylist("https://iptv-org.github.io/iptv/languages/ara.m3u");
                }

                const lastChannel = JSON.parse(localStorage.getItem('pixel_last_channel'));
                if (lastChannel) playChannel(lastChannel.url, lastChannel.name, lastChannel.logo, false);

                if(window.innerWidth > 768 && myFavorites.length > 0) updateQuickNav(myFavorites);
            } catch(e) {}
        };

        function toggleCinemaMode() { document.body.classList.toggle('cinema-active'); }

        function checkPlaylistSecurity(selectElem) {
            const url = selectElem.value;
            const protectedUrl = "https://raw.githubusercontent.com/zwrt/IPTV/refs/heads/Files/Adult.m3u";

            if (url === protectedUrl) {
                pendingSelectorElem = selectElem;
                modalInput.value = '';
                modalError.style.display = 'none';
                passwordModal.classList.add('active');
                setTimeout(() => modalInput.focus(), 150);
            } else {
                loadSelectedPlaylist(url);
            }
        }

        function confirmPasswordModal() {
            const entered = modalInput.value.trim();
            const correctPassword = "1234";

            if (entered === correctPassword) {
                passwordModal.classList.remove('active');
                const targetUrl = pendingSelectorElem ? pendingSelectorElem.value : "https://raw.githubusercontent.com/zwrt/IPTV/refs/heads/Files/Adult.m3u";
                loadSelectedPlaylist(targetUrl);
            } else {
                modalError.style.display = 'block';
                modalBox.classList.add('shake-animation');
                modalInput.value = '';
                setTimeout(() => modalBox.classList.remove('shake-animation'), 400);
            }
        }

        function cancelPasswordModal() {
            passwordModal.classList.remove('active');
            if (pendingSelectorElem) {
                pendingSelectorElem.value = "https://iptv-org.github.io/iptv/languages/ara.m3u";
                loadSelectedPlaylist("https://iptv-org.github.io/iptv/languages/ara.m3u");
            }
        }

        modalInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') confirmPasswordModal();
        });

        // Web Worker لمعالجة الملفات في خيط معالجة منفصل
        const workerCode = `
            self.onmessage = function(e) {
                const content = e.data;
                const lines = content.split('\\n');
                const groups = {};
                let currentGroup = 'عام', currentName = '', currentLogo = '';

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (line.startsWith('#EXTINF:')) {
                        const groupMatch = line.match(/group-title="([^"]+)"/i);
                        currentGroup = groupMatch ? groupMatch[1] : 'قنوات عامة';
                        const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                        currentLogo = logoMatch ? logoMatch[1] : '';
                        const commaIndex = line.lastIndexOf(',');
                        currentName = commaIndex !== -1 ? line.substring(commaIndex + 1).trim() : 'قناة غير معنونة';
                    } else if (line && !line.startsWith('#')) {
                        if (!groups[currentGroup]) groups[currentGroup] = [];
                        if (currentName) groups[currentGroup].push({ name: currentName, url: line, logo: currentLogo });
                        currentName = ''; currentLogo = '';
                    }
                }
                self.postMessage(groups);
            };
        `;
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const m3uWorker = new Worker(URL.createObjectURL(blob));

        m3uWorker.onmessage = function(e) {
            allChannelsData = e.data;
            renderGroups(allChannelsData);
        };

        async function loadSelectedPlaylist(url) {
            localStorage.setItem('pixel_last_playlist', url);
            
            const cacheKey = 'pixel_cache_' + url;
            const cachedData = localStorage.getItem(cacheKey);

            if (cachedData) {
                groupsList.innerHTML = '<div style="color: var(--neon-cyan); text-align: center; margin-top: 25px;">جاري الفتح السريع... ⚡</div>';
                m3uWorker.postMessage(cachedData);
                return;
            }

            groupsList.innerHTML = '<div style="color: var(--neon-cyan); text-align: center; margin-top: 25px;">جاري تحميل القوائم... 🚀</div>';
            
            try {
                let fetchUrl = url.startsWith('http://') ? resolveStreamUrl(url) : url;
                const res = await fetch(fetchUrl);
                const data = await res.text();
                try {
                    localStorage.setItem(cacheKey, data);
                } catch(e) {}
                m3uWorker.postMessage(data);
            } catch (err) {
                groupsList.innerHTML = '<div style="color: var(--neon-red); text-align: center; margin-top: 25px;">فشل الاتصال بالخادم.</div>';
            }
        }

        function renderGroups(groups, autoOpen = false, filterText = '') {
            groupsList.innerHTML = '';
            
            let favsToRender = myFavorites;
            if (filterText) favsToRender = myFavorites.filter(ch => ch.name.toLowerCase().includes(filterText));

            if (favsToRender.length > 0) createGroupElement('⭐ المفضلة', favsToRender, true);

            const groupKeys = Object.keys(groups).sort();
            groupKeys.forEach(group => {
                createGroupElement(group, groups[group], autoOpen);
            });
        }

        function createGroupElement(groupName, channelsArray, autoOpen) {
            if(channelsArray.length === 0) return;

            const details = document.createElement('details');
            details.innerHTML = `
                <summary><span>${groupName}</span> <span style="color:#888; font-size:0.8rem;" class="count-badge">[${channelsArray.length}]</span></summary>
                <div class="channels-container"></div>
            `;
            const container = details.querySelector('.channels-container');

            if (autoOpen || groupName === '⭐ المفضلة') {
                details.open = true;
                populateChannels(channelsArray, container);
            } else {
                details.addEventListener('toggle', function() {
                    if (this.open && !this.dataset.loaded) {
                        this.dataset.loaded = "true";
                        populateChannels(channelsArray, container);
                        if(window.innerWidth > 768) updateQuickNav(channelsArray);
                    }
                });
            }
            groupsList.appendChild(details);
        }

        function populateChannels(channels, container) {
            let html = '';
            // خفض عدد القنوات المعروضة دفعة واحدة لـ 80 قناة لحماية رام الموبايل
            const limit = window.innerWidth <= 768 ? 80 : 150;
            const limitChannels = channels.slice(0, limit);
            
            limitChannels.forEach((ch) => {
                const btnId = 'btn-' + Math.random().toString(36).substr(2, 9);
                const logoHtml = ch.logo ? `<img src="${ch.logo}" class="channel-logo" loading="lazy" onerror="this.style.opacity='0'">` : `<div class="channel-logo" style="background:transparent;"></div>`;
                const isFav = myFavorites.some(f => f.url === ch.url);
                const starChar = isFav ? '★' : '☆';

                html += `
                    <div class="channel-btn" id="${btnId}" data-url="${ch.url}" onclick="playChannel('${ch.url}', '${ch.name.replace(/'/g, "\\'")}', '${ch.logo}', true, false, this)">
                        ${logoHtml}
                        <span class="channel-name">${ch.name}</span>
                        <span class="channel-status"></span>
                        <button class="fav-btn ${isFav ? 'is-fav' : ''}" onclick="event.stopPropagation(); toggleFavorite('${ch.url}', '${ch.name.replace(/'/g, "\\'")}', '${ch.logo}')">${starChar}</button>
                    </div>
                `;
            });

            if (channels.length > limit) {
                html += `<div style="text-align:center; padding: 6px; font-size: 0.75rem; color: var(--neon-cyan);">تم عرض أول ${limit} قناة لضمان سرعة الهاتف (استخدم البحث للوصول للبقية)</div>`;
            }

            container.innerHTML = html;
        }

        async function startManualScan() {
            const scanBtn = document.getElementById('manual-scan-btn');
            if (scanBtn.dataset.scanning === "true") return;

            const allDetails = document.querySelectorAll('details');
            allDetails.forEach(details => {
                if (!details.open) {
                    details.open = true;
                    details.dispatchEvent(new Event('toggle'));
                    details.dataset.loaded = "true";
                }
            });

            await new Promise(r => setTimeout(r, 150));

            const channelBtns = document.querySelectorAll('.channel-btn');
            if (channelBtns.length === 0) return;

            scanBtn.dataset.scanning = "true";
            scanBtn.innerText = "جاري... ⏳";
            scanBtn.style.opacity = "0.7";

            let onlineCount = 0;
            let offlineCount = 0;

            for (let btn of channelBtns) {
                const url = btn.dataset.url;
                if (!url) continue;
                const statusSpan = btn.querySelector('.channel-status');
                if (statusSpan) statusSpan.innerText = "⏳";

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 2500);
                    const checkTarget = resolveStreamUrl(url);
                    await fetch(checkTarget, { method: 'HEAD', signal: controller.signal });
                    clearTimeout(timeoutId);
                    if (statusSpan) statusSpan.innerText = "✅";
                    onlineCount++;
                } catch (e) {
                    if (statusSpan) statusSpan.innerText = "❌";
                    offlineCount++;
                }
            }

            scanBtn.dataset.scanning = "false";
            scanBtn.innerText = `تم (✅${onlineCount} ❌${offlineCount})`;
            setTimeout(() => {
                scanBtn.innerText = "فحص 🔍";
                scanBtn.style.opacity = "1";
            }, 5000);
        }

        function removeOfflineChannels() {
            const channelBtns = document.querySelectorAll('.channel-btn');
            let removedCount = 0;

            channelBtns.forEach(btn => {
                const statusSpan = btn.querySelector('.channel-status');
                if (statusSpan && statusSpan.innerText === '❌') {
                    const detailsNode = btn.closest('details');
                    btn.remove();
                    removedCount++;

                    if (detailsNode) {
                        const badge = detailsNode.querySelector('.count-badge');
                        if (badge) {
                            let currentCount = parseInt(badge.innerText.replace(/[^0-9]/g, '')) || 0;
                            currentCount = Math.max(0, currentCount - 1);
                            badge.innerText = `[${currentCount}]`;
                            if (currentCount === 0) detailsNode.style.display = 'none';
                        }
                    }
                }
            });

            if (removedCount > 0) {
                alert(`تم مسح ${removedCount} قناة معطلة بنجاح!`);
            } else {
                alert("اضغط على 'فحص 🔍' أولاً لتمييز القنوات المعطلة.");
            }
        }

        function updateQuickNav(channelsArray) {
            quickNav.innerHTML = '';
            if(!channelsArray || channelsArray.length === 0 || window.innerWidth <= 768) { quickNav.style.display = 'none'; return; }
            quickNav.style.display = 'flex';
            channelsArray.forEach(ch => {
                const btn = document.createElement('div'); btn.className = 'bubble-btn'; btn.title = ch.name; 
                btn.onclick = () => playChannel(ch.url, ch.name.replace(/'/g, "\\'"), ch.logo);
                if (ch.logo) {
                    const img = document.createElement('img'); img.src = ch.logo; img.loading = 'lazy';
                    img.onerror = function() { this.style.display = 'none'; const fallback = document.createElement('div'); fallback.className = 'bubble-fallback'; fallback.innerText = ch.name.substring(0, 4); btn.appendChild(fallback); };
                    btn.appendChild(img);
                } else {
                    const fallback = document.createElement('div'); fallback.className = 'bubble-fallback'; fallback.innerText = ch.name.substring(0, 4); btn.appendChild(fallback);
                }
                quickNav.appendChild(btn);
            });
        }

        function toggleFavorite(url, name, logo) {
            const index = myFavorites.findIndex(f => f.url === url);
            if (index > -1) { myFavorites.splice(index, 1); } else { myFavorites.push({ url, name, logo }); }
            localStorage.setItem('pixel_favorites', JSON.stringify(myFavorites));
            const filter = document.getElementById('search-box').value.toLowerCase();
            if(filter) filterChannels(); else renderGroups(allChannelsData);
            if(window.innerWidth > 768) updateQuickNav(myFavorites);
        }

        let searchTimeout;
        function filterChannels() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const filter = document.getElementById('search-box').value.toLowerCase();
                if (!filter) { renderGroups(allChannelsData); return; }
                const filteredGroups = {};
                Object.keys(allChannelsData).forEach(group => {
                    const matchedChannels = allChannelsData[group].filter(ch => ch.name.toLowerCase().includes(filter));
                    if (matchedChannels.length > 0) filteredGroups[group] = matchedChannels;
                });
                renderGroups(filteredGroups, true, filter); 
            }, 250); 
        }

        function destroyAllPlayers() {
            try {
                if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
                if (dashInstance) { dashInstance.reset(); dashInstance = null; }
                if (tsInstance) { tsInstance.destroy(); tsInstance = null; }
                video.removeAttribute('src');
                video.load();
                qualitySelect.innerHTML = '<option value="-1">Auto</option>';
            } catch(e) {}
        }

        function getStreamType(url) {
            const lowerUrl = url.toLowerCase();
            if (lowerUrl.includes('.m3u8')) return 'hls';
            if (lowerUrl.includes('.mpd')) return 'dash';
            if (lowerUrl.includes('.ts') || lowerUrl.includes('.flv')) return 'ts';
            return 'native';
        }

        function playChannel(url, name, logoUrl, autoPlay = true, retryAttempt = false, clickedBtn = null) {
            try {
                localStorage.setItem('pixel_last_channel', JSON.stringify({ url, name, logo: logoUrl }));
                const logoDisplay = (logoUrl && logoUrl !== 'undefined') ? `<img src="${logoUrl}" onerror="this.style.display='none'">` : '';
                
                if (clickedBtn) {
                    document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active-channel'));
                    clickedBtn.classList.add('active-channel');
                }

                nowPlaying.innerHTML = `${logoDisplay} <span>جاري الاتصال... ${name}</span>`;

                destroyAllPlayers();
                const streamType = getStreamType(url);
                const targetUrl = resolveStreamUrl(url);

                const attemptPlay = () => {
                    video.play().catch(() => {
                        video.muted = true;
                        video.play().catch(() => {});
                    });
                };

                if (streamType === 'hls' && Hls.isSupported()) {
                    hlsInstance = new Hls({
                        enableWorker: true,
                        lowLatencyMode: true,
                        backBufferLength: 0,
                        maxBufferLength: 4,
                        maxMaxBufferLength: 8,
                        liveSyncDurationCount: 2,
                        startFragPrefetch: true,
                        manifestLoadingTimeOut: 3500,
                        fragLoadingTimeOut: 5000,
                        loader: StreamSecurityLoader
                    });

                    hlsInstance.loadSource(url);
                    hlsInstance.attachMedia(video);
                    
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, (e, data) => {
                        nowPlaying.innerHTML = `${logoDisplay} <span>جاري عرض: ${name}</span>`;
                        qualitySelect.innerHTML = '<option value="-1">Auto</option>';
                        data.levels.forEach((lvl, i) => {
                            const opt = document.createElement('option');
                            opt.value = i; opt.innerText = lvl.height ? lvl.height + 'p' : `مستوى ${i + 1}`;
                            qualitySelect.appendChild(opt);
                        });
                        if(autoPlay) attemptPlay();
                    });

                    hlsInstance.on(Hls.Events.ERROR, (e, data) => { 
                        if (data.fatal) {
                            if (!retryAttempt) {
                                const forcedProxyUrl = CF_PROXY + encodeURIComponent(url);
                                playChannel(forcedProxyUrl, name, logoUrl, autoPlay, true);
                            } else {
                                nowPlaying.innerHTML = "⚠️ عذراً، البث متوقف أو غير متوفر حالياً.";
                            }
                        } 
                    });

                } else if (streamType === 'dash' && typeof dashjs !== 'undefined') {
                    dashInstance = dashjs.MediaPlayer().create();
                    dashInstance.initialize(video, targetUrl, autoPlay);
                    dashInstance.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, () => {
                        nowPlaying.innerHTML = `${logoDisplay} <span style="color:var(--neon-green);">DASH: ${name}</span>`;
                    });
                    dashInstance.on(dashjs.MediaPlayer.events.ERROR, () => {
                        nowPlaying.innerHTML = "⚠️ فشل تشغيل قناة DASH.";
                    });

                } else if (streamType === 'ts' && typeof mpegts !== 'undefined' && mpegts.getFeatureList().mseLivePlayback) {
                    tsInstance = mpegts.createPlayer({ type: 'mse', isLive: true, url: targetUrl });
                    tsInstance.attachMediaElement(video);
                    tsInstance.load();
                    if(autoPlay) attemptPlay();
                    nowPlaying.innerHTML = `${logoDisplay} <span style="color:var(--neon-blue);">TS: ${name}</span>`;
                    
                    tsInstance.on(mpegts.Events.ERROR, () => {
                        nowPlaying.innerHTML = "⚠️ فشل تشغيل قناة TS.";
                    });

                } else {
                    video.src = targetUrl;
                    nowPlaying.innerHTML = `${logoDisplay} <span>جاري عرض: ${name}</span>`;
                    if(autoPlay) attemptPlay();
                    
                    video.onerror = () => {
                        nowPlaying.innerHTML = "⚠️ عذراً، تعذر تشغيل القناة.";
                    };
                }
            } catch (err) {
                nowPlaying.innerHTML = "⚠️ خطأ في تشغيل القناة.";
            }
        }

        function changeQuality(lvl) { if (hlsInstance) hlsInstance.currentLevel = parseInt(lvl); }
    </script>
</body>
